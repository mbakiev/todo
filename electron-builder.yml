# Packaging config (spec §11). Not exercised in phase 1; a later phase owns packaging.
appId: com.martin.todos
productName: Martins To Dos
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources
    to: .
    filter: ['**/*']
asar: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null # unsigned for now
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
