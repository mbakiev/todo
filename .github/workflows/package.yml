# Reusable: builds the installers with electron-builder (never publishes), smoke-tests the
# packaged app, and uploads the installers as workflow artifacts. Called by ci.yml and
# release.yml, so a release ships exactly what CI builds.
name: Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
            artifact: installers-macos
            files: |
              release/*/*.dmg
              release/*/*.zip
          # Each Windows arch is built on its own hardware, so the smoke and install tests
          # below run the exact installer that gets uploaded. windows-11-arm is GitHub's
          # Arm64 runner (free for public repositories).
          - os: windows-latest
            dist: dist:win:x64
            artifact: installers-windows-x64
            files: |
              release/*/*-win-x64-setup.exe
          - os: windows-11-arm
            dist: dist:win:arm64
            artifact: installers-windows-arm64
            files: |
              release/*/*-win-arm64-setup.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Typecheck + electron-vite build + electron-builder. `--publish never` on top of
      # `publish: null` in electron-builder.yml: CI never uploads anywhere by itself.
      - name: Build installers
        run: npm run ${{ matrix.dist }} -- --publish never

      - name: Smoke-test the packaged app
        run: npm run test:packaged

      # Windows: also prove the NSIS installer installs (silently, per-user, no UAC),
      # that the installed app runs, and that it uninstalls.
      - name: Install, smoke-test and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Exactly one installer, so the one tested here is the one uploaded below.
          $setup = @(Get-ChildItem release/*/*-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one installer, found $($setup.Count): $($setup.Name -join ', ')" }
          Start-Process -FilePath $setup[0].FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Martins To Dos'
          $exe = Join-Path $dir 'Martins To Dos.exe'
          if (-not (Test-Path $exe)) { throw "installed app not found: $exe" }
          $env:MARTIN_TODOS_PACKAGED_EXE = $exe
          npm run test:packaged
          if ($LASTEXITCODE -ne 0) { throw "smoke test against the installed app failed" }
          Start-Process -FilePath (Join-Path $dir 'Uninstall Martins To Dos.exe') -ArgumentList '/S' -Wait
          # The uninstaller copies itself to %TEMP% and returns at once; wait for removal.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }

      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          retention-days: 7
          if-no-files-found: error
          # Already compressed (dmg / zip / NSIS).
          compression-level: 0
